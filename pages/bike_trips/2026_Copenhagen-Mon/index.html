.custom-info-pin {
    background-color: #00ccff; /* Base blue */

    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0, 204, 255, 0.8);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    cursor: pointer;
}

.custom-info-pin:hover {
    transform: scale(1.3);
    box-shadow: 0 0 15px rgba(0, 204, 255, 1);
}

.custom-info-pin i {
    font-size: 18px;
}

.pin-point {
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #00ccff; /* color same as circle */
    position: absolute;
    bottom: -8px;      /* embedded into the circle */
    left: 50%;
    transform: translateX(-50%);
}

.custom-popup {

    border-radius: 8px;
    font-size: 14px;
    line-height: 1.3;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
}
